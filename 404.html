/* ============ FONTS (self-hosted) ============ */

/* Metric-matched fallbacks: the system font is resized to the web font's metrics so the swap causes no layout shift. */

/* ============ TOKENS (visual system unchanged) ============ */
:root{
  /* Raisey Lab palette (art direction 2026-09, from the approved founder visuals): ivory architecture, black tailoring,
     espresso shadows, deep burgundy typography; lavender + pale clinical blue as the digital/medical counterpoint. No pink. */
  --rl-ivory:#f3eee6; --rl-optical:#faf8f4; --rl-stone:#e7e0d6; --rl-stone-line:#d9cfc4; --rl-stone-strong:#c2b6aa;
  --rl-burgundy:#4f1a2a; --rl-burgundy-deep:#3a111d; --rl-ink:#1c1819; --rl-espresso:#211915; --rl-muted:#6b625e;
  --rl-lavender:#d5cfdd; --rl-lavender-pale:#e8e5ec; --rl-lavender-ink:#5d5670; --rl-blue:#dde6ea; --rl-blue-powder:#c9d5db; --rl-blue-ink:#3f5963;
  --rl-on-dark:#f3eee6; --rl-on-dark-2:#bdb2a6; --rl-line-dark:#3b302b;
  --cream:#f3eee6; --blush:#e7e0d6; --paper:#faf8f4;
  --p-red:#4f1a2a; --p-red-ink:#4f1a2a; --p-red-lt:#d5cfdd; --p-soft-lilac:#d5cfdd; --p-pale-lilac:#e8e5ec; --p-powder:#c2b6aa; --p-icy:#dde6ea; --p-plum:#1c1819; --p-burgundy:#4f1a2a; --p-graphite:#1c1819;
  --aub:#1c1819; --aub-2:#2c2422; --rasp:#4f1a2a; --rasp-d:#1c1819;
  --ink:#1c1819; --muted:#6b625e; --line:#d9cfc4; --line-strong:#c2b6aa;
  --on-aub:#f3eee6; --on-aub-2:#bdb2a6; --line-aub:#3b302b;
  --lilac:#d5cfdd; --lilac-d:#c4bdd0; --lime:#d2db98; --mauve:#5d5670;
  --err:#8c2a3a; --white:#fff; --placeholder:#8f8680;
  --rose-tint:#e7e0d6; --rose-ink:#4f1a2a; --rose-solid:#4f1a2a;
  --lav-tint:#d5cfdd; --lav-ink:#5d5670; --lav-solid:#5d5670;
  --gold-tint:#dde6ea; --gold-ink:#3f5963; --gold-solid:#3f5963;
  --sage-tint:#e8e5ec; --sage-ink:#1c1819; --sage-solid:#1c1819;
  --radius-card:26px; --radius-tile:14px; --radius-pill:999px;
  --dusty:#e7e0d6; --deep-rose:#c2b6aa; --optical:#faf8f4; --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; --ring-est:#5f7a6d; --ring-pot:#7c7598; --ring-elev:#4f1a2a;
  --serif:'Fraunces','Fraunces Fallback',Georgia,'Times New Roman',serif;
  --sans:'Inter','Inter Fallback',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gutter:clamp(20px,4.6vw,72px); --max:1360px; --head:72px;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:var(--head);-webkit-text-size-adjust:100%;scrollbar-color:var(--mauve) var(--cream)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--cream);color:var(--ink);font:400 17px/1.65 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4,h5,p,ul,ol,figure,blockquote{margin:0;padding:0}
ul,ol{list-style:none}
img,svg{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,h4,h5{font-family:var(--serif);font-weight:500;font-optical-sizing:auto;letter-spacing:-.018em;text-wrap:balance}
p{text-wrap:pretty}
::selection{background:var(--rasp);color:var(--white)}
input,textarea,select{caret-color:var(--rasp)}
a,button,label,input,select,textarea,summary{touch-action:manipulation}
html{-webkit-tap-highlight-color:color-mix(in srgb,var(--rasp) 14%,transparent)}
:focus-visible{outline:2px solid var(--rasp);outline-offset:3px}
.dark :focus-visible{outline-color:var(--on-aub)}
[hidden]{display:none!important}
.wrap{width:100%;max-width:var(--max);margin-inline:auto;padding-left:max(var(--gutter),env(safe-area-inset-left));padding-right:max(var(--gutter),env(safe-area-inset-right))}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hp{position:absolute!important;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}   /* anti-spam honeypot: invisible to people, filled by bots */
.skip{position:absolute;left:var(--gutter);top:-80px;z-index:100;background:var(--aub);color:var(--on-aub);padding:12px 18px;font-size:13px;text-decoration:none}
.skip:focus{top:10px}
.muted{color:var(--muted)}
.dark{background:var(--p-burgundy);color:var(--on-aub)}
.dark .muted{color:var(--on-aub-2)}
.eyebrow{font:600 12px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--p-red-ink)}
.dark .eyebrow{color:var(--p-pale-lilac)}
.sec{padding-block:clamp(72px,10vw,144px)}
.h2{font-size:clamp(2.2rem,1.1rem + 3.8vw,4.4rem);line-height:1.05}
.lede{font-size:clamp(1.05rem,.98rem + .35vw,1.3rem);line-height:1.6;color:var(--muted);max-width:40em}

/* section index label: wayfinding "02  Raisey Review" */
.sl{display:flex;align-items:baseline;gap:18px;margin-bottom:clamp(28px,4vw,52px);font:600 12px/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase}
.sl .n{color:var(--muted);font-variant-numeric:tabular-nums}
.sl .t{color:var(--ink)}
.sl .r{margin-left:auto;color:var(--muted);letter-spacing:.14em;font-weight:500;text-align:right}
.dark .sl .n,.dark .sl .r{color:var(--on-aub-2)}
@media (max-width:640px){.sl{flex-wrap:wrap;row-gap:4px}.sl .r{flex-basis:100%;margin-left:0;padding-left:calc(2ch + 18px);text-align:left}}
.dark .sl .t{color:var(--on-aub)}

/* arrows, drawn */
.ar{display:inline-block;width:18px;height:10px;flex:none;background:currentColor;
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 10' fill='none' stroke='black' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'><path d='M1 5h15M12 1l4 4-4 4'/></svg>") center/contain no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 10' fill='none' stroke='black' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'><path d='M1 5h15M12 1l4 4-4 4'/></svg>") center/contain no-repeat;
  transition:transform .4s var(--ease)}

/* buttons: raspberry, squared */
.btn{--b:var(--rasp);--f:var(--white);display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:52px;padding:15px 30px;background:var(--b);color:var(--f);border:1px solid var(--b);border-radius:var(--radius-pill);font:600 15px/1.2 var(--sans);letter-spacing:.01em;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background-color .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease),transform .2s var(--ease)}
.btn:hover{transform:translateY(-1px)}
/* 🔒 LOCKED 2026-09-22, revised 2026-09-22 · CTA colour/shape system — see memory presence-lab-locked-sections.
   owner-authorised visual change to the locked mid-page CTA (does not edit the locked HTML/CSS/JS text itself) */
.svc-cta .btn{--b:var(--p-burgundy);--f:var(--optical);border-color:var(--p-burgundy);min-height:64px;padding:20px 36px;font-size:16px;gap:18px}
@media (hover:hover){.btn:hover{--b:var(--rasp-d)}}
@media (hover:hover){.btn:hover .ar{transform:translateX(5px)}}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
@media (max-width:420px){.btn{white-space:normal;text-align:left;max-width:100%;padding-inline:20px}}
.tl{display:inline-flex;align-items:center;gap:10px;min-height:44px;font:600 14px/1.2 var(--sans);text-decoration:none;border-bottom:1.5px solid currentColor;padding-block:6px}
/* CTA colour hierarchy (scoped away from the locked services CTA) */
/* light primary: only the hero's own inline CTA — the quieter first interaction */
.hero-cta .btn{--b:var(--p-soft-lilac);--f:var(--p-graphite);border-color:var(--p-soft-lilac)}
/* deep burgundy = the one recurring conversion colour everywhere else it repeats */
.head-cta,.rv-cta .btn,.scan .btn,#contact .btn,#founding .btn{--b:var(--p-burgundy);--f:var(--optical);border-color:var(--p-burgundy)}
.rv-cta .btn,.scan .btn,#contact .btn,#founding .btn{min-height:64px;padding:20px 36px;font-size:16px;gap:18px}
/* a CTA ever placed on a burgundy panel must invert, never burgundy-on-burgundy */
.dark .btn{--b:var(--optical);--f:var(--p-plum);border-color:var(--optical)}
@media (hover:hover){.tl:hover .ar{transform:translateX(5px)}}

.langsw{display:inline-flex;align-items:center;gap:2px;font:600 12px/1 var(--sans);letter-spacing:.14em}
.langsw a,.langsw span{display:inline-flex;align-items:center;justify-content:center;min-width:40px;min-height:44px;text-decoration:none;color:var(--muted)}
.langsw [aria-current]{color:var(--ink)}
.langsw i{width:1px;height:14px;background:var(--line-strong)}
.langsw a:hover{color:var(--rasp)}
.langsw.m{display:none;margin-top:18px}
@media (max-width:1000px){.langsw.h{display:none}.mobile .langsw.m{display:inline-flex}}
/* ============ HEADER ============ */
.site-header{position:sticky;top:0;z-index:50;background:var(--cream);border-bottom:1px solid var(--line)}
.bar{height:var(--head);display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:inline-flex;align-items:center;min-height:44px;gap:12px;text-decoration:none;font:600 22px/1 var(--serif);letter-spacing:-.01em;white-space:nowrap}
.brand{text-transform:uppercase;letter-spacing:.07em}   /* RAISEY LAB wordmark test (preview) */
.nav ul{display:flex;gap:clamp(18px,2.6vw,40px)}
/* six nav items at 1001–1159px: use the nav's own 18px minimum gap, keep labels on one line and the logo mark at full size */
@media (min-width:1001px) and (max-width:1159px){.nav ul{gap:18px}}
.nav a{white-space:nowrap}
.nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;text-decoration:none;font:500 14px/1 var(--sans);color:var(--ink)}
.nav a::after{content:'';position:absolute;left:0;right:0;bottom:8px;height:1.5px;background:var(--rasp);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
.nav a.on::after{transform:scaleX(1)}
@media (hover:hover){.nav a:hover::after{transform:scaleX(1)}}
.head-cta{min-height:44px;padding:11px 22px;font-size:14px}
.menu-btn{display:none;align-items:center;gap:10px;background:none;border:0;color:var(--ink);min-height:44px;min-width:44px;padding:0 4px 0 12px;margin-right:-4px;cursor:pointer;font:600 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.menu-btn svg{overflow:visible}
.menu-btn .l1,.menu-btn .l2{transform-box:fill-box;transform-origin:center;transition:transform .4s var(--ease)}
.menu-btn[aria-expanded=true] .l1{transform:translateY(4px) rotate(45deg)}
.menu-btn[aria-expanded=true] .l2{transform:translateY(-4px) rotate(-45deg)}
.mobile{position:absolute;left:0;right:0;top:100%;background:var(--cream);border-bottom:1px solid var(--line);padding:6px 0 28px}
.mobile li+li{border-top:1px solid var(--line)}
.mobile a.l{display:block;padding:16px 0;font:500 30px/1.1 var(--serif);text-decoration:none}
.mobile .btn{margin-top:22px}
@media (max-width:1000px){.nav,.head-cta{display:none}.menu-btn{display:inline-flex}}

.site-footer{border-top:1px solid var(--line);padding-block:clamp(36px,5vw,64px) max(28px,env(safe-area-inset-bottom));margin-top:clamp(48px,7vw,96px)}
.f-row{display:grid;gap:20px;align-items:center}
.f-row nav ul{display:flex;flex-wrap:wrap;gap:0 28px}
.f-row nav a{display:inline-flex;align-items:center;min-height:44px;min-width:44px;text-decoration:none;font-weight:500;font-size:15px}
@media (hover:hover){.f-row nav a:hover{color:var(--rasp)}}
.f-legal{margin-top:clamp(20px,3vw,32px);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 24px}
.f-legal a{display:inline-flex;align-items:center;min-height:44px;color:var(--ink);text-underline-offset:.3em}
@media (min-width:900px){.f-row{grid-template-columns:1fr auto}}
@media (prefers-reduced-motion:reduce){.btn .ar,.tl .ar,.opt .mk,.opt .tx,.nav a::after,.track>span,.menu-btn .l1,.menu-btn .l2,.input,.btn{transition:none}}
@media print{.site-header{display:none}}

/* ================= RAISEY LAB ART DIRECTION (2026-09) =================
   Editorial studio × aesthetic medicine: ivory breathing room, burgundy anchor, ink authority, espresso dark moments,
   lavender + clinical blue for the Raisey Scan. Layout first; image crops are reviewed in a second pass. */
body{background:var(--rl-ivory)}
::selection{background:var(--rl-burgundy);color:var(--rl-optical)}
/* wordmark: the new logo direction (widely spaced editorial capitals). The & monogram will be added from the official SVG. */
.brand{font-weight:400;letter-spacing:.3em;gap:0}
.site-header .brand{font-size:17px}
/* official & monogram (from the approved logo) beside the RAISEY LAB wordmark */
.brand-amp{height:1.55em;width:auto;margin-right:.55em;position:relative;top:-.08em;flex-shrink:0}
/* hero: tension through typography and burgundy, not colour */
.hero{background:var(--rl-ivory)}
.hero h1{color:var(--rl-ink)}
.hero h1 .pun em{color:var(--rl-burgundy);font-weight:300}
.eyebrow{letter-spacing:.24em}
.arcs .a1{stroke:var(--rl-lavender)} .arcs .a2{stroke:var(--rl-blue-powder)} .arcs .a3{stroke:var(--rl-burgundy)} .arcs .dot{fill:var(--rl-ink)}
.hero-cta .btn{--b:var(--rl-lavender);--f:var(--rl-ink);border-color:var(--rl-lavender)}
/* Raisey Scan: the cooler diagnostic world */
.review{background:var(--rl-lavender-pale)}
.review .h2{color:var(--rl-burgundy)}
.review .dim-index li{background:var(--rl-blue)}
.review .dim-index .dn{color:var(--rl-blue-ink)}
/* approach: ivory with the burgundy anchor panel */
.trio .it .num,.trio .it:nth-child(2) .num,.trio .it:nth-child(3) .num{color:var(--rl-lavender)}
/* services: stone + optical cream (colours only; the locked component itself is unchanged) */
.svc-sec{background:var(--rl-optical)}
/* work / studies: an editorial index on clinical blue */
#work{background:var(--rl-blue)}
#work .case{background:transparent;border:0;border-top:1px solid var(--rl-ink);border-radius:0;box-shadow:none;padding:22px 0 8px}
#work .path b{background:transparent;color:var(--rl-ink);border:1px solid color-mix(in srgb,var(--rl-ink) 38%,transparent);border-radius:999px;font-family:var(--mono);font-weight:500;letter-spacing:.12em}
#work .path .ar{color:var(--rl-muted)}
#work .st-head .n{color:var(--rl-burgundy)}
/* ---- Selected Studies: editorial horizontal gallery (one study per slide; swipe, arrows, trackpad, drag) ---- */
#work{overflow-x:clip}
#work .cases{--csgap:clamp(16px,1.6vw,22px);display:flex;gap:var(--csgap);overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;
  margin-right:calc(50% - 50vw);padding-right:max(var(--gutter),calc(50vw - 50%));scroll-padding-left:0;outline:none;touch-action:pan-x pan-y}
#work .cases::-webkit-scrollbar{display:none}
#work .cases:focus-visible{outline:2px solid var(--rl-burgundy);outline-offset:6px}
#work .case{flex:0 0 calc(100vw - 2*var(--gutter) - 40px);scroll-snap-align:start;transition:opacity .45s var(--ease)}
#work .cases[data-ready] .case:not(.is-active){opacity:.42}
/* study cards: framed columns; widths from the section's content width (container units) so the next card shows as a glimpse */
#work .wrap{container-type:inline-size}
#work .case{flex-basis:calc(100cqw - 40px);border:1px solid color-mix(in srgb,var(--rl-ink) 14%,transparent);border-radius:6px;
  background:color-mix(in srgb,var(--rl-optical) 32%,transparent);padding:clamp(20px,2vw,26px) clamp(18px,1.8vw,24px) clamp(22px,2.2vw,28px);gap:14px}
@media (min-width:700px){#work .case{flex-basis:calc((100cqw - var(--csgap)) / 2)}}
@media (min-width:1000px){#work .case{flex-basis:calc((100cqw - 2 * var(--csgap)) / 3)}}
.cs-img{display:block;margin:0 0 4px}
.cs-img img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:3px;-webkit-user-drag:none;user-select:none}
.cs-more{display:none}
/* tablet/desktop: strict cross-card alignment — the track is a grid with 5 shared rows (image / label / title / tags / text)
   and every card inherits them via subgrid, so each zone starts at the same Y in all 6 cards, whatever the title or tag length */
@media (min-width:700px){
  #work .cases{display:grid;grid-template-columns:none;grid-auto-flow:column;grid-template-rows:repeat(5,auto);grid-auto-columns:calc((100cqw - var(--csgap)) / 2);row-gap:0}
  #work .case{container-type:normal;grid-row:span 5;display:grid;grid-template-rows:subgrid;row-gap:14px;align-content:start}   /* containment would disable subgrid */
  #work .case > *{align-self:start}
}
@media (min-width:1000px){#work .cases{grid-auto-columns:calc((100cqw - 2 * var(--csgap)) / 3)}}
/* mobile study cards: compact editorial format (shorter image, 4-line excerpt + "Read analysis"), desktop unchanged */
@media (max-width:699px){
  #work .case{gap:9px;padding:14px 14px 16px}
  #work .cs-img{margin-bottom:2px}
  #work .cs-img img{aspect-ratio:12/5}
  #work .case h3{font-size:1.35rem;line-height:1.14}
  #work .case p.path{margin:2px 0}
  #work .case p:not(.path):not(.cs-lab){font-size:14.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  #work .case.is-open p:not(.path):not(.cs-lab){display:block;-webkit-line-clamp:unset;overflow:visible}
  #work .cs-more{display:inline-flex;align-items:center;gap:10px;justify-self:start;min-height:36px;padding:0;background:none;border:0;border-bottom:1px solid currentColor;
    font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--rl-burgundy);cursor:pointer}
  #work .cs-more .ar{width:14px;height:8px}
  #work .case.is-open .cs-more .ar{transform:rotate(-90deg)}
  #work .cs-more[hidden]{display:none}
}
#work .case p.cs-lab{display:flex;gap:1.2em;font:500 11px/1.45 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--rl-ink)}
.cs-lab .cs-no{color:var(--rl-burgundy)}
@media (hover:hover) and (pointer:fine){#work .cases{cursor:grab}}
#work .cases.is-drag{cursor:grabbing;scroll-snap-type:none;user-select:none}
#work .cases.is-drag .case{transition:none}
.cs-nav{display:flex;align-items:center;gap:16px;margin-top:clamp(22px,3vw,34px);font:500 12px/1 var(--mono);letter-spacing:.14em;color:var(--rl-ink)}
.cs-count{min-width:5.2em;text-align:center;font-variant-numeric:tabular-nums}
.cs-count .t{color:var(--rl-muted)}
.cs-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:999px;border:1px solid color-mix(in srgb,var(--rl-ink) 30%,transparent);background:transparent;color:var(--rl-ink);cursor:pointer;transition:border-color .2s,opacity .2s}
.cs-btn:hover:not(:disabled){border-color:var(--rl-burgundy);color:var(--rl-burgundy)}
