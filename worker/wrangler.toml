# Kinassay Lab form endpoint. PUBLIC configuration only — the Resend API key is a secret:
#   npx wrangler secret put RESEND_API_KEY
name = "raisey-forms"
main = "src/index.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://kinassay.com,https://www.kinassay.com,https://raiseylab.com,https://www.raiseylab.com"  # raiseylab.* = transition only (old site until its redirect is live); remove after go-live
FROM_EMAIL = "Kinassay Lab <hello@kinassay.com>"
TO_EMAIL = "hello@kinassay.com"
SITE_URL = "https://kinassay.com"

# Exact rate limits (5 submissions/min per IP, 2 Scan-results emails/min per recipient): one Durable Object counter per key.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Copy of every accepted submission for the Kinassay CRM (synced on request; entries expire after 24 months, as the privacy policy says).
[[kv_namespaces]]
binding = "LEADS"
id = "09fa4dff5e9f4afab27da49cdc63bd43"

[observability]
enabled = true
